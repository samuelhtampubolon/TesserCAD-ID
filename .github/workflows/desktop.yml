# Build the downloadable desktop application.
#
# The binary is produced here rather than committed, and that is a security
# decision before it is a tidiness one. A committed .exe is a blob nobody can
# review, cannot be traced to the source it came from, and has to be trusted on
# the word of whoever pushed it. Built here, every release artefact comes from a
# commit anyone can read, by a workflow anyone can read, on a runner nobody
# controls, with a SHA-256 published beside it.
#
# Every artefact also gets a signed build-provenance attestation, which is the
# part that actually answers "is this binary the one built from that source".
# A SHA-256 proves two files are identical; an attestation proves which commit,
# workflow and runner produced the file, signed by a transparency log the
# publisher does not control. That is a stronger claim than an ordinary
# code-signing certificate makes, and unlike one it cannot be bought.
#
# Triggered by a version tag, or by hand from the Actions tab.
name: Desktop build

on:
  push:
    tags: ['v*']

  # By hand, with an optional tag to publish under.
  #
  # Pushing a tag was the only way to publish, and that needs a clone and a
  # push right for `refs/tags/*` - two things the person deciding to release
  # does not always have in front of them. The Releases page can create a tag
  # too, but it is six fields in a form, and picking the wrong Target there
  # publishes a release built from the wrong commit.
  #
  # With a tag given here, this run publishes under it: the tag is created by
  # the release step at the end, from the commit this run built and verified,
  # and only if every check above it passed. That ordering is the point. A
  # pushed tag exists the moment it is pushed, whatever the build then makes
  # of it, and v1.0.0 is the proof - it was tagged before the release globs
  # were fixed, so it permanently names a build missing an artefact two pages
  # offered. Here there is nothing to delete and re-cut: a red run leaves no
  # tag behind.
  #
  # Left empty, it builds and verifies and publishes nothing, which is what
  # this trigger did before and still the right thing to do on a doubt.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Terbitkan rilis dengan tag ini, misalnya v1.1.1. Kosongkan untuk membangun dan memeriksa tanpa menerbitkan apa pun.'
        required: false
        default: ''

  # Also on any pull request that touches the desktop build itself.
  #
  # Without this, a change to desktop/ was only ever exercised by a tag, which
  # means the first time anyone learned it was broken was when a release
  # produced nothing. That happened: upgrading electron-builder to 26 made
  # `publisherName` an invalid key, the whole configuration was rejected, and
  # the tests said nothing because they read the YAML as text rather than
  # validating it. The release steps below are gated on `RELEASE_TAG`, which
  # is empty for a pull request, so one builds and verifies without publishing
  # anything.
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - 'tools/verify-desktop.cjs'

permissions:
  contents: write
  # Required to mint the provenance attestation below. Both are the narrow
  # scopes the attestation action documents; nothing here needs more.
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The tag this run publishes under, or empty for a run that publishes
    # nothing. One expression, read by three steps, so there is one answer to
    # "is this a release" rather than three conditions that can disagree.
    #
    # `inputs.tag` is empty on every event but a manual one, and the second
    # half reads the ref only when it is a version tag, so a push of any other
    # ref cannot reach the release step by accident.
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # electron-builder takes ${version} from desktop/package.json, not from
      # the tag, and nothing kept the two in step: v1.0.1 shipped files named
      # TesserCAD-1.0.0-*. Checked here rather than left to be noticed, because
      # the artefacts are already built and named by the time anyone looks.
      # A hand-typed tag is checked for shape first. A pushed tag matched
      # `v*` before it could get here; a dispatched one has been through
      # nothing at all, and the release step creates whatever it is given.
      # `1.1.1`, `v1.1`, or a pasted line with a space in it would each become
      # a permanent tag on a public repository.
      - name: The tag and the manifest must agree on the version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$RELEASE_TAG\" is not a version tag. It has to read v1.2.3, with the v."
            exit 1
          fi
          tag="${RELEASE_TAG#v}"
          manifest=$(node -p "require('./desktop/package.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $RELEASE_TAG says $tag, desktop/package.json says $manifest."
            echo "::error::Every artefact would be named $manifest. Bump the manifest and re-tag."
            exit 1
          fi
          echo "tag $RELEASE_TAG matches manifest $manifest"

      # A tag that already exists names a release that already has assets, and
      # the release step would upload this run's files over them. That is the
      # one way this trigger could damage something rather than fail to make
      # it: a dispatch naming v1.1.0 would replace a published download with a
      # build from a different commit, under a hash and an attestation that
      # no longer match what anyone downloaded before.
      #
      # Only a dispatched tag is checked. A pushed one exists by definition,
      # which is how this run started.
      - name: The tag being published must be a new one
        if: inputs.tag != ''
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG already exists. Raise the version in desktop/package.json first;"
            echo "::error::re-publishing under it would overwrite the downloads that release already has."
            exit 1
          fi
          echo "$RELEASE_TAG is free; it will be created from $GITHUB_SHA once every check below passes"

      # The web application has no dependencies, so its own checks run first
      # and cost nothing. A desktop build of a broken app is worse than none.
      - name: Verify the application before packaging it
        run: npm test

      # `npm ci`, not `npm install`: it installs exactly the tree in
      # package-lock.json and fails if the manifest and the lock disagree. A
      # provenance attestation that says "built from this commit" is worth
      # rather less if the dependency tree could differ between two runs of it.
      #
      # Retried because electron's postinstall pulls a ~100 MB binary from
      # GitHub releases, and that transfer fails often enough to have already
      # broken a build here with ECONNRESET. Three attempts with a pause
      # between them, rather than a whole release failing on one reset socket.
      - name: Install the shell's build tooling
        working-directory: desktop
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3); retrying in $((attempt * 15))s"
            rm -rf node_modules
            sleep $((attempt * 15))
          done
          echo "npm ci failed three times; this is not a transient network error"
          exit 1

      # Launch the real shell and drive the real application in it. The other
      # suites test the app in a browser or in Node; neither exercises what the
      # desktop build changes, which is that the page is served over a private
      # scheme instead of over HTTP. Linux only, because it needs a display
      # server and xvfb is the one that is already here.
      # Electron needs a handful of X and GTK libraries that the runner image
      # does not carry by default, and xvfb to have a display at all. Without
      # these the verification step below fails for reasons that have nothing
      # to do with the application.
      - name: Install the libraries Electron needs to open a window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgbm1 libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 \
            libasound2t64 libxss1 libxtst6

      - name: Verify the shell actually runs the application
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox ../tools/verify-desktop.cjs

      # electron-builder validates its configuration against a schema and
      # refuses the whole file for one unknown key, naming neither the key nor
      # the reason. Checked on its own first so that failure arrives in
      # seconds with the config in front of you, rather than after a
      # three-minute package step.
      - name: The packaging configuration is valid
        working-directory: desktop
        run: ./node_modules/.bin/electron-builder --config electron-builder.yml --dir --publish never

      # The step that was missing, and the reason a broken download could ship.
      #
      # Everything above this line either builds the artefact or tests the
      # source tree. `verify-desktop.cjs` runs a stand-in main process against
      # a checkout on Linux only, so the packaged Windows application had never
      # been launched by anything, once, ever. Nothing covered the asar the
      # files are read from, the locale paks `electronLanguages` filters out,
      # or any path difference between a checkout and `resources/app.asar`.
      #
      # This launches the real binary that `--dir` just produced and asks the
      # page whether the application started, over the DevTools protocol. It
      # runs on both platforms, because the whole point is that Windows was
      # the untested one.
      - name: The packaged application actually starts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node tools/verify-packaged.mjs
          else
            node tools/verify-packaged.mjs
          fi

      - name: Package
        working-directory: desktop
        run: npm run dist

      # The size promise on the front page, enforced.
      #
      # The cap is the promise, not a ceiling picked above today's measurement,
      # so a build that breaks the promise goes red instead of the page quietly
      # becoming false. It has already done its job once, on the first Windows
      # build that ever ran: the page promised "around 70 MB, under 80 MB" and
      # the artefacts measured 88.25 MB portable, 88.47 MB installer and
      # 87.85 MB for the 7z. The page was corrected to the measured figures
      # rather than the cap being raised to hide them.
      #
      # 90 MB is then about 1.5 MB above what the build produces: close enough
      # to catch a regression, not so close that a point release of Electron
      # turns the build red on its own.
      #
      # If this fails, the levers, with what each costs:
      #   1. find what was added. A sudden jump is almost always a lost
      #      `compression: maximum` or `electronLanguages` key in
      #      desktop/electron-builder.yml rather than genuine growth.
      #   2. pin an older Electron major. This is the only lever that reaches
      #      under 80 MB: the three artefacts are within 0.7 MB of each other,
      #      so the archive format is not the variable, Electron 44 is. It
      #      costs Chromium security updates, and tools/tests/desktop.mjs
      #      asserts a supported major on purpose, so taking this lever means
      #      changing that assertion deliberately and saying why.
      #   3. restate the number on the front page, as was done once already.
      # Raising the cap without doing one of those three is not on the list:
      # that changes the promise silently, which is the failure this step
      # exists to prevent.
      - name: The Windows download is the size the README promises
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Integer arithmetic throughout. The Windows runner's bash is Git
          # Bash, which ships no `bc`, and reaching for it failed this step
          # rather than the artefact: the size it was meant to report never
          # printed.
          cap=90
          fail=0
          found=0
          shopt -s nullglob
          for f in dist-desktop/*portable.exe dist-desktop/*setup.exe dist-desktop/*windows*.7z; do
            found=1
            bytes=$(stat -c%s "$f")
            printf '%-46s %4d.%02d MB   (cap %d MB)\n' "$(basename "$f")" \
              "$((bytes / 1048576))" "$(((bytes % 1048576) * 100 / 1048576))" "$cap"
            if [ "$bytes" -gt $((cap * 1024 * 1024)) ]; then
              echo "   ^ over the 90 MB the front page promises"
              fail=1
            fi
          done
          # nullglob means no match is an empty loop, so without this the gate
          # would pass loudest exactly when there was nothing to measure.
          if [ "$found" = 0 ]; then
            echo "No Windows artefact to measure. The packaging step should have produced one:"
            ls -la dist-desktop || true
            exit 1
          fi
          if [ "$fail" = 1 ]; then
            echo
            echo "See the comment above this step for the levers, in order."
            echo "The usual cause of a sudden jump is a lost compression or"
            echo "electronLanguages key in desktop/electron-builder.yml."
            exit 1
          fi
          echo "the download keeps the promise on the front page"

      # A hash lets anyone confirm the file they downloaded is the file this
      # workflow produced. It is the only verification available without a
      # code-signing certificate, and it is worth more than a self-signed one.
      - name: Publish checksums
        shell: bash
        run: |
          cd dist-desktop
          for f in *.exe *.7z *.zip *.AppImage *.dmg *.tar.gz; do
            [ -e "$f" ] || continue
            sha256sum "$f" | tee "$f.sha256"
          done
          echo '--- artefacts ---'
          ls -la

      # Cryptographic proof of where each file came from. Verified by anyone
      # with:  gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-desktop/*.exe
            dist-desktop/*.7z
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.dmg
            dist-desktop/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: tessercad-id-${{ matrix.artifact }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.7z
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.dmg
            dist-desktop/*.tar.gz
            dist-desktop/*.sha256
          if-no-files-found: error

      # Pinned to a commit, not to `v2`. This is the one third-party action in
      # the repository and it runs in a job holding `contents: write`, so a tag
      # is the wrong thing to trust: a tag is a name its owner can repoint at
      # any time, and the release job would fetch whatever it pointed at next.
      # The commit is immutable. `git ls-remote` on the tag is how to re-resolve
      # it when this is deliberately bumped.
      #
      # `tag_name` is given rather than inferred from the ref, because on a
      # dispatched release there is no tag to infer it from yet: this step
      # creates it, at `target_commitish`, which is the commit this job has
      # just built and verified. A tag created by GITHUB_TOKEN does not start
      # another workflow run, so publishing this way cannot loop back into a
      # second build of the same commit.
      - name: Attach to the release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-desktop/*.exe
            dist-desktop/*.7z
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.dmg
            dist-desktop/*.tar.gz
            dist-desktop/*.sha256
          fail_on_unmatched_files: false
